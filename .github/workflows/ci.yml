name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Train model (smoke)
        run: python training/train.py

      - name: Run tests
        run: python -m pytest -q

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: models/v0.1/metrics.json

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: model-v0.1
          path: models/v0.1/model.joblib